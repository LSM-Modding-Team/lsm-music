<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#a92724">
  <title>Reproductor de audio</title>
  <link rel="icon" href="assets/images/lsm_march.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <svg class="icon-definitions" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="icon-play" viewBox="0 0 16 16"><path d="M4 2v12l10-6z"/></symbol>
    <symbol id="icon-pause" viewBox="0 0 16 16"><path d="M3 2h4v12H3zm6 0h4v12H9z"/></symbol>
    <symbol id="icon-stop" viewBox="0 0 16 16"><path d="M3 3h10v10H3z"/></symbol>
    <symbol id="icon-previous" viewBox="0 0 16 16"><path d="M2 2h2v12H2zm12 0L4 8l10 6z"/></symbol>
    <symbol id="icon-next" viewBox="0 0 16 16"><path d="M12 2h2v12h-2zM2 2v12l10-6z"/></symbol>
    <symbol id="icon-volume" viewBox="0 0 16 16"><path d="M1 6h3l4-4v12l-4-4H1z"/><path d="M10 5q4 3 0 6m2-8q6 5 0 10" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
    <symbol id="icon-muted" viewBox="0 0 16 16"><path d="M1 6h3l4-4v12l-4-4H1z"/><path d="m10 5 5 6m0-6-5 6" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
  </defs></svg>
  <main class="player" aria-label="Reproductor de audio">
    <header class="title-bar"><img src="assets/images/lsm_march.png" alt="" width="16" height="16"><h1 id="player-title">Reproductor de audio</h1></header>
    <div class="playlist" aria-label="Discos">
      <button class="track" data-track="0" type="button" aria-label="Reproducir Marcha Sanmartiniana" aria-pressed="false"><img src="assets/images/lsm_march.png" alt="" width="64" height="64"><span>Marcha Sanmartiniana</span></button>
      <button class="track" data-track="1" type="button" aria-label="Reproducir Himno Sanmartiniano" aria-pressed="false"><img src="assets/images/lsm_anthem.png" alt="" width="64" height="64"><span>Himno Sanmartiniano</span></button>
    </div>
    <div class="controls">
      <input id="seek" type="range" min="0" max="100" step="0.1" value="0" disabled aria-label="Posición de reproducción" aria-valuetext="0:00">
      <div class="buttons">
        <button id="previous" type="button" aria-label="Disco anterior"><svg aria-hidden="true"><use href="#icon-previous"/></svg></button>
        <button id="play" type="button" aria-label="Reproducir"><svg aria-hidden="true"><use href="#icon-play"/></svg></button>
        <button id="stop" type="button" aria-label="Detener"><svg aria-hidden="true"><use href="#icon-stop"/></svg></button>
        <button id="next" type="button" aria-label="Disco siguiente"><svg aria-hidden="true"><use href="#icon-next"/></svg></button>
        <div class="volume"><button id="mute" type="button" aria-label="Silenciar" aria-pressed="false"><svg aria-hidden="true"><use href="#icon-volume"/></svg></button><input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volumen"></div>
      </div>
    </div>
    <p id="status" class="sr-only" role="status" aria-live="polite"></p>
    <audio id="audio" preload="none"></audio>
  </main>
</body>
</html>
